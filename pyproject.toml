[project]
name = "manga-to-kindle"
version = "0.1.0"
description = "Aplicativo desktop local para organizar mangás e preparar exportações para Kindle."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8,<7",
    "SQLAlchemy>=2.0,<3",
    "alembic>=1.14,<2",
    "pydantic>=2.10,<3",
]

[project.scripts]
manga-to-kindle = "manga_to_kindle.main:main"

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/manga_to_kindle"]

[tool.pytest.ini_options]
addopts = ["-ra"]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["manga_to_kindle"]
strict = true
show_error_codes = true
pretty = true

